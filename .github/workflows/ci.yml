name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Formats, then fails on any difference and prints it, so the fix is in the log.
      - name: Check formatting
        run: dart format . && git diff --exit-code -- .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
